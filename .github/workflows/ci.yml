name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Backend tests
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Frontend tests
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run lint
          npm run build

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build and start stack
        run: docker compose up -d --build

      - name: Wait for backend health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/api/health; then exit 0; fi
            sleep 2
          done
          echo "backend not healthy"; docker compose logs; exit 1

      - name: Curl API endpoints
        run: |
          set -e
          echo "health:"; curl -s http://localhost:8000/api/health
          echo
          echo "config:"; curl -s http://localhost:8000/api/config
          echo
          echo "series count:"; curl -s http://localhost:8000/api/series | python3 -c "import sys,json; d=json.load(sys.stdin); print(len(d)); print(d[0])"
          echo "metrics:"; curl -s http://localhost:8000/api/metrics | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['overall'])"

      - name: Check frontend responds
        run: |
          curl -sf http://localhost:8080 | head -c 200
          echo

      - name: Tear down
        if: always()
        run: docker compose down -v
