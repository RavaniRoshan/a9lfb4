<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" role="img" aria-label="UK Wind Forecast Accuracy hero">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="420" rx="24" fill="url(#g)"/>
  <text x="60" y="120" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="52" font-weight="700" fill="#e2e8f0">UK Wind Forecast Accuracy</text>
  <text x="60" y="170" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="26" fill="#94a3b8">Decision-eligible day-ahead wind forecasts vs actuals · January 2026</text>
  <g transform="translate(60,230)">
    <rect width="250" height="120" rx="16" fill="#1e293b"/>
    <text x="20" y="45" font-size="20" fill="#94a3b8" font-family="system-ui">MAE</text>
    <text x="20" y="90" font-size="34" font-weight="700" fill="#38bdf8" font-family="system-ui">2,145 MW</text>
  </g>
  <g transform="translate(330,230)">
    <rect width="250" height="120" rx="16" fill="#1e293b"/>
    <text x="20" y="45" font-size="20" fill="#94a3b8" font-family="system-ui">RMSE</text>
    <text x="20" y="90" font-size="34" font-weight="700" fill="#38bdf8" font-family="system-ui">2,616 MW</text>
  </g>
  <g transform="translate(600,230)">
    <rect width="250" height="120" rx="16" fill="#1e293b"/>
    <text x="20" y="45" font-size="20" fill="#94a3b8" font-family="system-ui">Bias</text>
    <text x="20" y="90" font-size="34" font-weight="700" fill="#38bdf8" font-family="system-ui">+1,852 MW</text>
  </g>
  <g transform="translate(870,230)">
    <rect width="250" height="120" rx="16" fill="#1e293b"/>
    <text x="20" y="45" font-size="20" fill="#94a3b8" font-family="system-ui">MAPE</text>
    <text x="20" y="90" font-size="34" font-weight="700" fill="#38bdf8" font-family="system-ui">22.44%</text>
